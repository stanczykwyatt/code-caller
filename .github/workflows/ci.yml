name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Check the app has no network access
        run: |
          entitlements="$(codesign -d --entitlements - --xml "build/Copy 2FA.app" 2>/dev/null)"
          if grep -q "com.apple.security.network" <<< "$entitlements"; then
            echo "::error::Copy 2FA must never have a network entitlement."
            exit 1
          fi
          echo "No network entitlements."
